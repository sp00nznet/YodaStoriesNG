stages:
  - build
  - package
  - deploy

variables:
  DOTNET_VERSION: "8.0"
  PROJECT_YODA: "src/YodaStoriesNG.Engine/YodaStoriesNG.Engine.csproj"
  PROJECT_INDY: "src/IndyNG.Engine/IndyNG.Engine.csproj"
  RELEASE_PATH: "/mnt/releases"
  NFS_SERVER: "192.168.100.22"
  NFS_SHARE: "/pool/releases/YodaStoriesNG"

# Build for Windows x64
build:windows:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore
    - dotnet publish $PROJECT_YODA -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/windows/YodaStoriesNG
    - dotnet publish $PROJECT_INDY -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/windows/IndyNG
  artifacts:
    paths:
      - publish/windows/
    expire_in: 1 week

# Build for Linux x64
build:linux:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore
    - dotnet publish $PROJECT_YODA -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/linux/YodaStoriesNG
    - dotnet publish $PROJECT_INDY -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/linux/IndyNG
    - chmod 755 publish/linux/YodaStoriesNG/*
    - chmod 755 publish/linux/IndyNG/*
  artifacts:
    paths:
      - publish/linux/
    expire_in: 1 week

# Build for macOS x64
build:macos:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore
    - dotnet publish $PROJECT_YODA -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/macos/YodaStoriesNG
    - dotnet publish $PROJECT_INDY -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/macos/IndyNG
    - chmod 755 publish/macos/YodaStoriesNG/*
    - chmod 755 publish/macos/IndyNG/*
  artifacts:
    paths:
      - publish/macos/
    expire_in: 1 week

# Package all builds into zips
package:
  stage: package
  image: alpine:latest
  needs:
    - build:windows
    - build:linux
    - build:macos
  before_script:
    - apk add --no-cache zip
  script:
    - VERSION=$(date +%Y%m%d-%H%M%S)
    - echo "VERSION=$VERSION" > version.env
    # Create Windows zip
    - cd publish/windows && zip -r ../../YodaStoriesNG-windows-x64-$VERSION.zip . && cd ../..
    # Create Linux zip
    - cd publish/linux && zip -r ../../YodaStoriesNG-linux-x64-$VERSION.zip . && cd ../..
    # Create macOS zip
    - cd publish/macos && zip -r ../../YodaStoriesNG-macos-x64-$VERSION.zip . && cd ../..
    # Create combined release zip
    - mkdir -p release
    - cp publish/windows/YodaStoriesNG/* release/ 2>/dev/null || true
    - cp publish/windows/IndyNG/* release/ 2>/dev/null || true
    - mv release YodaStoriesNG-$VERSION
    - zip -r YodaStoriesNG-$VERSION.zip YodaStoriesNG-$VERSION
    - ls -la *.zip
  artifacts:
    paths:
      - "*.zip"
      - version.env
    expire_in: 1 month

# Deploy to NFS share
deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - package
  tags:
    - nfs-deploy
  before_script:
    - apk add --no-cache nfs-utils
    - source version.env
  script:
    - mkdir -p $RELEASE_PATH
    - mount -t nfs $NFS_SERVER:$NFS_SHARE $RELEASE_PATH
    - cp -v *.zip $RELEASE_PATH/
    - chmod 755 $RELEASE_PATH/*.zip
    - ls -la $RELEASE_PATH/
    - umount $RELEASE_PATH
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: manual
  environment:
    name: production
    url: http://$NFS_SERVER$NFS_SHARE
